<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Frontline Copilot</title>
    <script>
      // Set the theme before the first paint, so a dark page never flashes light.
      // The key matches STORAGE_KEY in src/hooks/useTheme.ts.
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem("frontline-copilot.theme");
        } catch (error) {
          stored = null;
        }
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
