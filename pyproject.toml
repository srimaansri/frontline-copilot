[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontline-copilot"
version = "0.1.0"
description = "AI copilot for wireless-carrier frontline support agents, built on Databricks Free Edition."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added in the milestone that first uses them (PLAN.md §13).
dependencies = [
    "presidio-analyzer==2.2.366",
    "pydantic==2.14.3",
    "pydantic-settings[yaml]==2.16.2",
    "spacy==3.8.18",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
# Local data generation (data_gen/).
data = [
    "databricks-sdk==0.166.0",
    "faker==40.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "trafilatura==2.3.1",
]
# The copilot itself: retrieval, the chat model and tracing. Kept out of the core
# dependencies so the pipeline job on Databricks, which only needs redaction and
# chunking, does not install MLflow and LangChain.
rag = [
    "databricks-langchain==0.22.0",
    "databricks-sdk==0.166.0",
    # The agent graph. databricks-langchain already brings it in; pinned here
    # because the copilot imports it directly.
    "langgraph==1.2.22",
    "mlflow[databricks]==3.18.0",
    # Reading grade, for the output guardrail and the evaluation.
    "textstat==0.7.13",
]
# Evaluation (eval/).
eval = [
    "frontline-copilot[rag]",
    "python-dotenv==1.2.4",
    "ragas==0.4.4",
    # RAGAS imports pyarrow through `datasets`. On Python 3.11 pip resolves
    # databricks-connect to 16.x, which requires numpy<2, and recent pyarrow
    # refuses to import with NumPy 1.x ("pyarrow requires NumPy 2.0 or newer").
    # pyarrow does not declare that, so pip cannot see the conflict. On 3.12
    # databricks-connect is 17.x, everything is on NumPy 2 and no cap is needed.
    # CI prints the resolved versions as a notice on each run.
    'pyarrow<20; python_version < "3.12"',
]
# The web interface: a REST API (api/) that also serves the built front end (web/).
app = [
    "frontline-copilot[rag]",
    "fastapi==0.163.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]
# The MCP server (mcp_server/). databricks-langchain already brings the SDK in;
# pinned here because the server imports it directly.
mcp = [
    "frontline-copilot[rag]",
    "mcp==1.30.0",
    "python-dotenv==1.2.4",
]
# The spaCy pipeline the redactor uses by default. Models are not on PyPI.
models = [
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]
dev = [
    "frontline-copilot[app,data,eval,mcp]",
    # Small pipeline for unit tests, so CI does not download the default one.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.hatch.metadata]
# Needed for the spaCy model wheels above, which are installed by URL.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplifications
    "RET",     # return statements
    "PTH",     # pathlib over os.path
    "PT",      # pytest style
    "S",       # bandit; S608 flags string-built SQL
    "D",       # docstrings on public API
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["api", "copilot", "data_gen", "eval", "mcp_server"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests also use seeded `random`, to repeat a mutation; it is not used for security.
"tests/**" = ["S101", "D", "S311"]
# Seeded `random` is the point of the generators; it is not used for security.
"data_gen/**" = ["S311"]
# Databricks notebooks: `spark` and `dbutils` are injected globals (F821), cells are
# not a public API (D), imports follow the `%pip`-style setup cell (E402), and table
# names come from a widget set by the job, not from a user or a model (S608).
# `F` and `T` are the usual PySpark aliases for functions and types (N812).
"pipelines/**" = ["D", "F821", "E402", "S608", "N812"]
"setup/**" = ["D", "F821", "E402", "S310", "S603"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Third-party libraries without type stubs get an `ignore_missing_imports`
# override here, each added when the library is first imported.

[[tool.mypy.overrides]]
# Ships no type information. Used in one place, behind the `ChatModel` protocol.
module = ["databricks_langchain", "databricks_langchain.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ships no type information. Used in one place, `copilot.readability`.
module = ["textstat", "textstat.*"]
ignore_missing_imports = true

# --- pytest and coverage ----------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the top-level `data_gen` and `eval` packages.
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["src/copilot"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
